<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #217dbb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Contact Us</h2>

        <form action="/submit" method="POST">

            <label>Name:</label>
            <input type="text" name="name"
                   placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <label>Message:</label>
            <textarea name="message"
                      placeholder="Enter your message"
                      required></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
