<!DOCTYPE html>
<html>
<head>
    <title>Student CRUD Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1, h2 {
            text-align: center;
            color: #2563eb;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .edit {
            background: #f59e0b;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Management System</h1>

    <h2>Add Student</h2>

    <form action="/add" method="POST">
        <input type="text" name="name"
               placeholder="Student Name" required>

        <input type="email" name="email"
               placeholder="Email" required>

        <input type="text" name="course"
               placeholder="Course" required>

        <button type="submit">Add Student</button>
    </form>

    <h2>Student Records</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>
                <a class="edit"
                   href="/edit/{{ student[0] }}">Edit</a>

                <form action="/delete/{{ student[0] }}"
                      method="POST"
                      style="display:inline;">
                    <button class="delete" type="submit">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
